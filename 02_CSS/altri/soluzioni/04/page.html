<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/style1.css" id="theme-link" />
  <title>Layout Example</title>
  
  <script>
  function switchTheme(theme) {
    document.getElementById('theme-link').href = theme;
  }
</script>



</head>
<body>
 <header>
  <h1>My Web Programming Lesson</h1>
  <div class="theme-switcher">
    <button onclick="switchTheme('./css/style1.css')">Classic</button>
    <button onclick="switchTheme('./css/style2.css')">Modern</button>
    <button onclick="switchTheme('./css/style3.css')">Dark</button>
    <button onclick="switchTheme('./css/style4.css')">Reversed Layout</button>
  </div>
</header>

  <div class="container">
    <aside>
      <nav>
        <ul>
          <li><button id="showTableBtn">Show Table</button></li>
          <li><button id="showFormBtn">Show Form</button></li>
          <li><button id="logoutBtn">Logout</button></li>
        </ul>
      </nav>
    </aside>

    <main>
      <section id="content">
        <h2>Welcome!</h2>
        <p>Select an option from the left to display content.</p>
      </section>
    </main>
  </div>

  <footer>
    <p>&copy; 2025 Web Programming Course</p>
  </footer>
</body>
</html>
