<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Layout Example</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style1.css">

  <style>
    /* Small inline fix for demonstration */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>

<body>
  <!-- Navbar (Left on large screens, collapsible on small screens) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark flex-lg-column p-3 fixed-top h-100">
    <a class="navbar-brand mb-3" href="#">My Course</a>
    <button
      class="navbar-toggler mb-2"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse flex-lg-column" id="navbarNav">
      <ul class="navbar-nav flex-lg-column w-100">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Lessons</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Resources</a></li>
      </ul>
    </div>

    <div class="mt-auto text-center text-light small">
      &copy; 2025 Web Programming
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container-fluid" style="margin-left: 220px;">
    <div class="row">
      <!-- Main Content -->
      <main class="col-lg-8 col-md-12 py-4">
        <div id="content-area" class="p-4 bg-white rounded shadow-sm">
          <h2>Welcome!</h2>
          <p>Select an option from the right panel to display content.</p>
        </div>
      </main>

      <!-- Aside (Right panel) -->
      <aside class="col-lg-3 col-md-12 py-4">
        <div class="p-3 bg-light rounded shadow-sm">
          <h5>Actions</h5>
          <button id="showTableBtn" class="btn btn-primary w-100 my-2">Show Table</button>
          <button id="showFormBtn" class="btn btn-secondary w-100 my-2">Show Form</button>
          <button id="logoutBtn" class="btn btn-danger w-100 my-2">Logout</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-auto bg-dark text-light text-center py-3">
    <p class="mb-0">&copy; 2025 Web Programming Course</p>
  </footer>

  <!-- Bootstrap JS (bundle includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
